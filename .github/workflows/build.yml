name: Build and test
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: builds-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  unix:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, platform: linux-x64, cc: gcc}
          - {os: ubuntu-24.04-arm, platform: linux-arm64, cc: gcc}
          - {os: macos-14, platform: macos-arm64, cc: clang}
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and test
        run: |
          make CFLAGS=-Werror release
          make smoke
          make test
          python3 scripts/package.py --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  windows:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            msystem: UCRT64
            cc: gcc
            packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python
          - os: windows-11-arm
            platform: windows-arm64
            msystem: CLANGARM64
            cc: clang
            packages: mingw-w64-clang-aarch64-clang mingw-w64-clang-aarch64-python
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: make git ${{ matrix.packages }}
      - name: Build and smoke test
        shell: msys2 {0}
        run: |
          make CFLAGS=-Werror LDFLAGS=-static release
          make LDFLAGS=-static PYTHON=python smoke
          python scripts/package.py --platform '${{ matrix.platform }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  ci:
    name: CI
    if: always()
    needs: [unix, windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platforms to pass
        env:
          UNIX_RESULT: ${{ needs.unix.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: test "$UNIX_RESULT" = success && test "$WINDOWS_RESULT" = success
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist
      - name: Create or update draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "JACE $RELEASE_TAG" --notes "Automated packages passed platform checks. Review licensing, version, and release notes before publication."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
